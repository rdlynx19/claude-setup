# Default ruff config, used only when the project has none of its own.
# Mirrors ROS 2 ament_flake8 / ament_pep257 so editor results agree with `colcon test`.
line-length = 99
target-version = "py310"  # ROS 2 Humble

[format]
quote-style = "single"

[lint]
select = ["E", "W", "F", "N", "D", "Q", "I", "A", "C4"]
# ament_pep257's "ament" convention ignores, minus D100-D107: every docstring is required.
# The summary goes on the 2nd line (D213).
# Docstrings use reST fields (:param:, :returns:); see rules/python.md.
ignore = ["D203", "D212", "D404"]

[lint.flake8-quotes]
inline-quotes = "single"

[lint.isort]
force-sort-within-sections = true  # Google import order, as ament_flake8 uses
